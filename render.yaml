services:
  - type: web
    name: chandabook
    env: python
    region: singapore
    plan: free
    buildCommand: >-
      pip install -r requirements.txt &&
      python manage.py collectstatic --no-input &&
      python manage.py migrate
    startCommand: gunicorn chandabook.wsgi:application --workers 2 --timeout 120
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: DATABASE_URL
        fromDatabase:
          name: chandabook-db
          property: connectionString
      - key: PYTHON_VERSION
        value: "3.11.0"

databases:
  - name: chandabook-db
    databaseName: chandabook
    user: chandabook_user
    region: singapore
    plan: free
