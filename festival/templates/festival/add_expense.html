{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  {% include 'pwa_tags.html' %}
  <meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Add Expense – {{ festival.name }}</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css"/>
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    :root{--bg:#f5f0e8;--white:#fff;--surface:#fffdf5;--border:#e8dfc8;--accent:#d97706;--accent-lt:#fef3c7;--green:#059669;--green-lt:#d1fae5;--red:#dc2626;--red-lt:#fee2e2;--text:#1c1917;--muted:#78716c;--radius:18px;--radius-sm:11px}
    [data-theme=dark]{--bg:#1c1208;--white:#2a1f0e;--surface:#33250f;--border:#4a3520;--accent:#f59e0b;--accent-lt:#3a2500;--text:#fef3c7;--muted:#a8a29e}
    body{font-family:'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
    .topbar{background:var(--white);border-bottom:1.5px solid var(--border);padding:12px 16px;position:sticky;top:0;z-index:100;display:flex;align-items:center;gap:10px}
    .brand-icon{width:36px;height:36px;background:linear-gradient(135deg,#dc2626,#ea580c);border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:1.1rem}
    .back-btn{color:var(--muted);text-decoration:none;display:flex;align-items:center;gap:4px;font-size:.85rem}.back-btn:hover{color:var(--accent)}
    .theme-toggle{width:34px;height:34px;background:var(--surface);border:1.5px solid var(--border);border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:.95rem;color:var(--text);margin-left:auto}
    .page{max-width:580px;margin:0 auto;padding:22px 14px 80px}
    .form-card{background:var(--white);border:1.5px solid var(--border);border-radius:var(--radius);padding:22px}
    .form-title{font-size:1.15rem;font-weight:800;margin-bottom:18px;display:flex;align-items:center;gap:10px}
    .form-group{margin-bottom:16px}
    label{display:block;font-size:.78rem;font-weight:600;color:var(--muted);margin-bottom:5px;text-transform:uppercase;letter-spacing:.4px}
    input,select,textarea{width:100%;padding:11px 13px;border:1.5px solid var(--border);border-radius:9px;font-size:.9rem;background:var(--surface);color:var(--text);font-family:inherit;outline:none;transition:.15s}
    input:focus,select:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-lt)}
    textarea{resize:vertical;min-height:72px}
    .form-row{display:grid;grid-template-columns:1fr 1fr;gap:14px}
    .btn{display:inline-flex;align-items:center;gap:6px;padding:12px 24px;border-radius:10px;font-size:.9rem;font-weight:700;border:none;cursor:pointer;transition:.15s;text-decoration:none;width:100%;justify-content:center}
    .btn-primary{background:#dc2626;color:#fff}.btn-primary:hover{filter:brightness(1.1)}
    .cat-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px;margin-bottom:4px}
    .cat-btn{padding:9px 10px;border:1.5px solid var(--border);border-radius:9px;background:var(--surface);cursor:pointer;text-align:center;transition:.15s;font-size:.78rem;font-weight:600}
    .cat-btn:hover,.cat-btn.selected{border-color:var(--accent);background:var(--accent-lt);color:var(--accent)}
    .receipt-preview{margin-top:8px;display:none;}
    .receipt-preview img{max-width:100%;border-radius:9px;border:1.5px solid var(--border);}
    .hint{font-size:.72rem;color:var(--muted);margin-top:4px}
    @media(max-width:480px){.form-row{grid-template-columns:1fr}}
  </style>
</head>
<body>
<div class="topbar">
  <div class="brand-icon">🧾</div>
  <a href="{% url 'festival_dashboard' fid=festival.id %}" class="back-btn"><i class="ti ti-arrow-left"></i> {{ festival.name }}</a>
  <div class="theme-toggle" onclick="toggleTheme()">🌙</div>
</div>

<div class="page">
  <div class="form-card">
    <div class="form-title">🧾 Add Festival Expense</div>
    <form method="post" enctype="multipart/form-data">
      {% csrf_token %}

      <div class="form-group">
        <label>Expense Title *</label>
        <input type="text" name="title" placeholder="e.g. Pandal Decoration" required/>
      </div>

      <div class="form-group">
        <label>Category *</label>
        <div class="cat-grid" id="catGrid">
          {% for val, label in categories %}
          <div class="cat-btn" onclick="selectCat('{{ val }}', this)">{{ label }}</div>
          {% endfor %}
        </div>
        <input type="hidden" name="category" id="catInput" value="Miscellaneous"/>
        <div class="hint">Tap to select a category</div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label>Amount (₹) *</label>
          <input type="number" name="amount" min="1" step="0.01" placeholder="e.g. 5000" required/>
        </div>
        <div class="form-group">
          <label>Date *</label>
          <input type="date" name="date" value="{{ today }}" required/>
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label>Paid By *</label>
          <input type="text" name="paid_by" placeholder="Who paid this amount" required/>
        </div>
        <div class="form-group">
          <label>Payment Mode *</label>
          <select name="payment_mode" required>
            {% for val, label in payment_choices %}
            <option value="{{ val }}">{{ label }}</option>
            {% endfor %}
          </select>
        </div>
      </div>

      <div class="form-group">
        <label>Description</label>
        <textarea name="description" placeholder="Details about this expense (vendor, items, etc.)"></textarea>
      </div>

      <div class="form-group">
        <label>Receipt / Bill Photo</label>
        <input type="file" name="receipt" id="receiptFile" accept="image/*"
               onchange="previewReceipt(this)"/>
        <div class="receipt-preview" id="receiptPreview">
          <img id="previewImg" src="" alt="Receipt preview"/>
        </div>
        <!-- OCR Scan button — shown after image selected -->
        <div id="ocrSection" style="display:none;margin-top:10px;">
          <button type="button" id="ocrBtn" onclick="scanReceipt()"
                  style="display:inline-flex;align-items:center;gap:6px;padding:9px 16px;border-radius:9px;font-size:.82rem;font-weight:700;border:none;cursor:pointer;background:#7c3aed;color:#fff;transition:.15s;">
            🔍 Scan Receipt (Auto-Fill)
          </button>
          <div id="ocrStatus" style="font-size:.75rem;color:var(--muted);margin-top:6px;"></div>
        </div>
        <!-- OCR result preview -->
        <div id="ocrResult" style="display:none;margin-top:10px;background:var(--surface);border:1.5px solid var(--accent);border-radius:9px;padding:12px;">
          <div style="font-size:.78rem;font-weight:700;color:var(--accent);margin-bottom:6px;">📋 Extracted from Receipt:</div>
          <div id="ocrText" style="font-size:.8rem;color:var(--muted);white-space:pre-wrap;max-height:100px;overflow-y:auto;"></div>
        </div>
      </div>

      <button type="submit" class="btn btn-primary"><i class="ti ti-check"></i> Save Expense</button>
    </form>
  </div>
</div>

<script>
// ── Category selector ──
function selectCat(val, el) {
  document.getElementById('catInput').value = val;
  document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('selected'));
  el.classList.add('selected');
}

// ── Receipt preview ──
function previewReceipt(input) {
  const wrap = document.getElementById('receiptPreview');
  const img  = document.getElementById('previewImg');
  const ocr  = document.getElementById('ocrSection');
  if (input.files && input.files[0]) {
    const reader = new FileReader();
    reader.onload = e => {
      img.src = e.target.result;
      wrap.style.display = 'block';
      ocr.style.display  = 'block';
    };
    reader.readAsDataURL(input.files[0]);
  }
}

// ── OCR Scan ──
async function scanReceipt() {
  const fileInput = document.getElementById('receiptFile');
  if (!fileInput.files[0]) return;

  const btn    = document.getElementById('ocrBtn');
  const status = document.getElementById('ocrStatus');
  const result = document.getElementById('ocrResult');
  const resText= document.getElementById('ocrText');

  btn.disabled    = true;
  btn.textContent = '⏳ Scanning…';
  status.textContent = 'Sending receipt to OCR engine…';
  result.style.display = 'none';

  const form = new FormData();
  form.append('receipt', fileInput.files[0]);

  try {
    const resp = await fetch("{% url 'ocr_receipt' fid=festival.id %}", {
      method: 'POST',
      headers: { 'X-CSRFToken': '{{ csrf_token }}' },
      body: form,
    });
    const data = await resp.json();

    if (data.error) {
      status.textContent = '❌ ' + data.error;
      status.style.color = 'var(--red)';
    } else {
      // ── Auto-fill amount ──
      if (data.amount) {
        document.querySelector('input[name="amount"]').value = data.amount;
        status.textContent = `✅ Auto-filled: ₹${data.amount}`;
        status.style.color = 'var(--green)';
      } else {
        status.textContent = '⚠️ Amount not detected — please fill manually.';
        status.style.color = 'var(--muted)';
      }

      // ── Auto-fill description with merchant ──
      if (data.merchant) {
        const descField = document.querySelector('textarea[name="description"]');
        if (!descField.value) descField.value = data.merchant;
      }

      // ── Show raw text preview ──
      if (data.raw_text) {
        resText.textContent = data.raw_text;
        result.style.display = 'block';
      }

      // ── Flash highlight on amount field ──
      const amtField = document.querySelector('input[name="amount"]');
      amtField.style.borderColor = 'var(--green)';
      amtField.style.boxShadow   = '0 0 0 3px var(--green-lt)';
      setTimeout(() => {
        amtField.style.borderColor = '';
        amtField.style.boxShadow   = '';
      }, 2500);
    }
  } catch (err) {
    status.textContent = '❌ Network error: ' + err.message;
    status.style.color = 'var(--red)';
  } finally {
    btn.disabled    = false;
    btn.textContent = '🔍 Scan Again';
  }
}

// ── Pre-select Miscellaneous on load ──
window.addEventListener('DOMContentLoaded', () => {
  document.querySelectorAll('.cat-btn').forEach(b => {
    if (b.textContent.trim() === 'Miscellaneous') b.classList.add('selected');
  });
});

function toggleTheme(){const h=document.documentElement,d=h.getAttribute('data-theme')==='dark';h.setAttribute('data-theme',d?'':'dark');document.querySelector('.theme-toggle').textContent=d?'🌙':'☀️';localStorage.setItem('theme',d?'light':'dark');}
(function(){const t=localStorage.getItem('theme');if(t==='dark'){document.documentElement.setAttribute('data-theme','dark');document.addEventListener('DOMContentLoaded',()=>{const b=document.querySelector('.theme-toggle');if(b)b.textContent='☀️';});}})();
</script>
</body>
</html>
