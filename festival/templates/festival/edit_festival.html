{% load static %}
<!DOCTYPE html><html lang="en"><head>
  {% include 'pwa_tags.html' %}<meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Edit Festival</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css"/>
<style>*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}:root{--bg:#f5f0e8;--white:#fff;--surface:#fffdf5;--border:#e8dfc8;--accent:#d97706;--accent-lt:#fef3c7;--text:#1c1917;--muted:#78716c;--radius:18px;--radius-sm:11px}[data-theme=dark]{--bg:#1c1208;--white:#2a1f0e;--surface:#33250f;--border:#4a3520;--accent:#f59e0b;--accent-lt:#3a2500;--text:#fef3c7;--muted:#a8a29e}body{font-family:'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh}.topbar{background:var(--white);border-bottom:1.5px solid var(--border);padding:12px 16px;position:sticky;top:0;z-index:100;display:flex;align-items:center;gap:10px}.brand-icon{width:36px;height:36px;background:linear-gradient(135deg,#d97706,#ea580c);border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:1.1rem}.back-btn{color:var(--muted);text-decoration:none;display:flex;align-items:center;gap:4px;font-size:.85rem}.back-btn:hover{color:var(--accent)}.theme-toggle{width:34px;height:34px;background:var(--surface);border:1.5px solid var(--border);border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:.95rem;color:var(--text);margin-left:auto}.page{max-width:580px;margin:0 auto;padding:22px 14px 80px}.form-card{background:var(--white);border:1.5px solid var(--border);border-radius:var(--radius);padding:22px}.form-title{font-size:1.15rem;font-weight:800;margin-bottom:18px}.form-group{margin-bottom:16px}label{display:block;font-size:.78rem;font-weight:600;color:var(--muted);margin-bottom:5px;text-transform:uppercase;letter-spacing:.4px}input,select,textarea{width:100%;padding:11px 13px;border:1.5px solid var(--border);border-radius:9px;font-size:.9rem;background:var(--surface);color:var(--text);font-family:inherit;outline:none;transition:.15s}input:focus,select:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-lt)}textarea{resize:vertical;min-height:72px}.form-row{display:grid;grid-template-columns:1fr 1fr;gap:14px}.btn{display:inline-flex;align-items:center;gap:6px;padding:11px 22px;border-radius:9px;font-size:.88rem;font-weight:700;border:none;cursor:pointer;transition:.15s;text-decoration:none;justify-content:center}.btn-primary{background:var(--accent);color:#fff}.btn-primary:hover{filter:brightness(1.1)}.btn-ghost{background:transparent;color:var(--muted);border:1.5px solid var(--border)}.btn-ghost:hover{background:var(--accent-lt);color:var(--accent);border-color:var(--accent)}@media(max-width:480px){.form-row{grid-template-columns:1fr}}</style></head>
<body>
<div class="topbar"><div class="brand-icon">🪔</div><a href="{% url 'festival_dashboard' fid=festival.id %}" class="back-btn"><i class="ti ti-arrow-left"></i> Back</a><div class="theme-toggle" onclick="toggleTheme()">🌙</div></div>
<div class="page"><div class="form-card">
  <div class="form-title">✏️ Edit Festival</div>
  <form method="post">{% csrf_token %}
    <div class="form-group"><label>Festival Name *</label><input type="text" name="name" value="{{ festival.name }}" required/></div>
    <div class="form-row">
      <div class="form-group"><label>Festival Type *</label><select name="festival_type" required>{% for val, label in festival_types %}<option value="{{ val }}" {% if festival.festival_type == val %}selected{% endif %}>{{ label }}</option>{% endfor %}</select></div>
      <div class="form-group"><label>Location *</label><input type="text" name="location" value="{{ festival.location }}" required/></div>
    </div>
    <div class="form-row">
      <div class="form-group"><label>Start Date *</label><input type="date" name="start_date" value="{{ festival.start_date }}" required/></div>
      <div class="form-group"><label>End Date *</label><input type="date" name="end_date" value="{{ festival.end_date }}" required/></div>
    </div>
    <div class="form-group"><label>Target Collection (₹)</label><input type="number" name="target_collection" value="{{ festival.target_collection }}" min="0" step="0.01"/></div>
    <div class="form-group"><label>Description</label><textarea name="description">{{ festival.description }}</textarea></div>
    <div style="display:flex;gap:10px;">
      <button type="submit" class="btn btn-primary" style="flex:1;"><i class="ti ti-check"></i> Save Changes</button>
      <a href="{% url 'festival_dashboard' fid=festival.id %}" class="btn btn-ghost">Cancel</a>
    </div>
  </form>
</div></div>
<script>function toggleTheme(){const h=document.documentElement,d=h.getAttribute('data-theme')==='dark';h.setAttribute('data-theme',d?'':'dark');document.querySelector('.theme-toggle').textContent=d?'🌙':'☀️';localStorage.setItem('theme',d?'light':'dark');}(function(){const t=localStorage.getItem('theme');if(t==='dark'){document.documentElement.setAttribute('data-theme','dark');document.addEventListener('DOMContentLoaded',()=>{const b=document.querySelector('.theme-toggle');if(b)b.textContent='☀️';});}})();</script>
</body></html>
