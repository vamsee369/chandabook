{% load static %}
<!DOCTYPE html><html lang="en"><head>
  {% include 'pwa_tags.html' %}<meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Edit Member</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css"/>
<style>*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}:root{--bg:#f5f0e8;--white:#fff;--surface:#fffdf5;--border:#e8dfc8;--accent:#d97706;--accent-lt:#fef3c7;--text:#1c1917;--muted:#78716c;--radius:18px;--radius-sm:11px}[data-theme=dark]{--bg:#1c1208;--white:#2a1f0e;--surface:#33250f;--border:#4a3520;--accent:#f59e0b;--accent-lt:#3a2500;--text:#fef3c7;--muted:#a8a29e}body{font-family:'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh}.topbar{background:var(--white);border-bottom:1.5px solid var(--border);padding:12px 16px;position:sticky;top:0;z-index:100;display:flex;align-items:center;gap:10px}.brand-icon{width:36px;height:36px;background:linear-gradient(135deg,#2563eb,#7c3aed);border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:1.1rem}.back-btn{color:var(--muted);text-decoration:none;display:flex;align-items:center;gap:4px;font-size:.85rem}.back-btn:hover{color:var(--accent)}.theme-toggle{width:34px;height:34px;background:var(--surface);border:1.5px solid var(--border);border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:.95rem;color:var(--text);margin-left:auto}.page{max-width:560px;margin:0 auto;padding:22px 14px 80px}.form-card{background:var(--white);border:1.5px solid var(--border);border-radius:var(--radius);padding:22px}.form-title{font-size:1.1rem;font-weight:800;margin-bottom:16px}.form-group{margin-bottom:14px}label{display:block;font-size:.78rem;font-weight:600;color:var(--muted);margin-bottom:5px;text-transform:uppercase;letter-spacing:.4px}input{width:100%;padding:10px 13px;border:1.5px solid var(--border);border-radius:9px;font-size:.9rem;background:var(--surface);color:var(--text);font-family:inherit;outline:none;transition:.15s}input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-lt)}.form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}.btn{display:inline-flex;align-items:center;gap:6px;padding:11px 20px;border-radius:9px;font-size:.87rem;font-weight:700;border:none;cursor:pointer;transition:.15s;text-decoration:none}.btn-primary{background:var(--accent);color:#fff}.btn-primary:hover{filter:brightness(1.1)}.btn-ghost{background:transparent;color:var(--muted);border:1.5px solid var(--border)}.btn-ghost:hover{background:var(--accent-lt);color:var(--accent);border-color:var(--accent)}@media(max-width:480px){.form-row{grid-template-columns:1fr}}</style></head>
<body>
<div class="topbar"><div class="brand-icon">👤</div><a href="{% url 'manage_members' fid=festival.id %}" class="back-btn"><i class="ti ti-arrow-left"></i> Members</a><div class="theme-toggle" onclick="toggleTheme()">🌙</div></div>
<div class="page"><div class="form-card">
  <div class="form-title">✏️ Edit Member — {{ member.name }}</div>
  <form method="post">{% csrf_token %}
    <div class="form-row">
      <div class="form-group"><label>Full Name *</label><input type="text" name="name" value="{{ member.name }}" required/></div>
      <div class="form-group"><label>Phone</label><input type="tel" name="phone" value="{{ member.phone }}"/></div>
    </div>
    <div class="form-row">
      <div class="form-group"><label>Address</label><input type="text" name="address" value="{{ member.address }}"/></div>
      <div class="form-group"><label>Promised Amount (₹)</label><input type="number" name="promised_amount" value="{{ member.promised_amount }}" min="0" step="0.01"/></div>
    </div>
    <div class="form-group"><label>Notes</label><input type="text" name="notes" value="{{ member.notes }}"/></div>
    <div style="display:flex;gap:10px;">
      <button type="submit" class="btn btn-primary"><i class="ti ti-check"></i> Save</button>
      <a href="{% url 'manage_members' fid=festival.id %}" class="btn btn-ghost">Cancel</a>
    </div>
  </form>
</div></div>
<script>function toggleTheme(){const h=document.documentElement,d=h.getAttribute('data-theme')==='dark';h.setAttribute('data-theme',d?'':'dark');document.querySelector('.theme-toggle').textContent=d?'🌙':'☀️';localStorage.setItem('theme',d?'light':'dark');}(function(){const t=localStorage.getItem('theme');if(t==='dark'){document.documentElement.setAttribute('data-theme','dark');document.addEventListener('DOMContentLoaded',()=>{const b=document.querySelector('.theme-toggle');if(b)b.textContent='☀️';});}})();</script>
</body></html>
